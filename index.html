function renderNav(filter) {
  navEl.innerHTML = "";
  GROUPS.forEach(function (g) {
    var items = DATA.filter(function (s) { return s.group === g.key; });
    if (filter) items = items.filter(function (s) {
      return (s.title + (s.scene || "")).toLowerCase().indexOf(filter.toLowerCase()) > -1;
    });
    if (!items.length) return;
    var div = document.createElement("div");
    div.className = "nav-group";
    div.innerHTML = '<div class="g-title"><span class="g-dot" style="background:' + g.color + '"></span>' + g.name + '</div>';
    items.forEach(function (s) {

      b.innerHTML = '<span class="no">' + s.no + '</span>' + s.title;
      b.onclick = function () { select(s); };
      div.appendChild(b);
    });
    navEl.appendChild(div);
  });
}

var MANUAL = {"课程任务发布": {"sec": "1. 课程任务（P1-2）", "text": ["课程任务", "辅立码课课程任务包括：“码上提分”精品课程、校本课程、名校课程。在【课程】界面可选择通过“码上提分”精品课程，或者在校本课程中选择需要发给学生的内容。", "点击布置任务，可跳转到任务设置界面，如图1-3所示。选择完成需要发布的任务点击布置任务，会跳转到任务设置界面。"], "imgs": [{"src": "基础操作/2-课程任务发布/手册/01.png", "cap": "图1-1 任务类型入口"}, {"src": "基础操作/2-课程任务发布/手册/02.png", "cap": "图1-2 课程列表"}, {"src": "基础操作/2-课程任务发布/手册/03.png", "cap": "图1-3 跳转任务设置"}]}, "学科网选题": {"sec": "7. 学科网选题（P10-11）", "text": ["学科网选题", "首次登录需要微信扫码绑定学科网账号，绑定后辅立码课账号即可与学科网账号进行关联，后续点击【学科网选题】即可自动登录。", "学科网账号，为老师的手机号/邮箱/用户名/或微信扫码登录，如果您是学校新开的账号，系统会自动给您发送开通短信，短信内有初始密码，如图1-21所示：", "点击学科网选题之后，会跳转到学科网的选题界面，在学科网中选择自己需要的题目，加入选题篮，然后点击去组卷，点击选好了，等待组卷完成之后进入辅立码课，可以以任务的形式发送给学生。"], "imgs": [{"src": "基础操作/3-学科网选题/手册/01.png", "cap": "图1-20 学科网入口"}, {"src": "基础操作/3-学科网选题/手册/02.png", "cap": "图1-21 选题界面"}, {"src": "基础操作/3-学科网选题/手册/03.png", "cap": "图1-22 加入选题篮"}, {"src": "基础操作/3-学科网选题/手册/04.png", "cap": "图1-23 去组卷"}, {"src": "基础操作/3-学科网选题/手册/05.png", "cap": "图1-24 组卷完成"}]}, "练习任务发布（题库/选卷）": {"sec": "5. 题库选题任务 ／ 9. 任务发布界面（P8-9、P12-13）", "text": ["题库选题任务", "通过【题库选题】可以跳转到题库界面，根据不同的筛选方式，选取自己的需要的题目。", "视频题目优先，学生做答完成之后，到达答案公布时间的时候，题目会携带视频解析。", "过滤已使用，可以帮助老师筛选和排除已经使用过的题目。", "任务发布介绍", "任务发布界面中：", "任务名称：建议写任务发布时间+任务内容；", "时间设置：根据需求填写发布时间，默认是立即发布，可以设定发布时间", "截止时间默认是自发布任务起24小时截至，可根据需求设定截止时间", "公布答案默认是提交后可见，防止学生间传达答案，建议设定答案公布时间", "允许晚交默认是允许，非必要时间限制的任务建议是允许晚交，学生数据收集是常态化的动作，可以收集更完整数据。", "阅卷方式：学生通过Pad提交作业，选择题系统会自动批阅，非选择题拍照上传，可以通过学生互阅（学生之间互相批阅作业）、教师批阅、学生自阅（学生自己批改作业）三种方式完成，大大减少了教师批改作业的时间。", "学生互阅：用在非正式的批阅作业、练习等，优点是减轻老师阅卷负担，学生提交答案后，先根据答案自己改错，然后再批阅1至2份系统自动推送的其他同学试卷，也能通过评价别人来提升自己的理解水平。", "教师批阅：教师科通过微信小程序（辅立教学）或电脑登录网站批改作业。通过微信（辅立教学）小程序可以随时随地批改作业，解放了固定时间、固定地点批改作业的障碍。"], "imgs": [{"src": "基础操作/4-练习任务发布/手册/01.png", "cap": "图1-15 题库筛选"}, {"src": "基础操作/4-练习任务发布/手册/02.png", "cap": "图1-17 选卷任务"}, {"src": "基础操作/4-练习任务发布/手册/03.png", "cap": "图1-26 选题篮调整"}, {"src": "基础操作/4-练习任务发布/手册/04.png", "cap": "图1-27 任务发布界面"}]}, "资料任务": {"sec": "2. 资料任务（P2-3）", "text": ["资料任务", "点击资料任务之后，会进入资料任务界面，输入任务名称，添加附件，编辑任务内容。可以把课堂使用的ppt或者英语听力发送给学生，支持多种文件的格式，需要注意，附件大小限制80MB。资料任务学生只可观看学习，不可以进行作答上传答案。"], "imgs": [{"src": "基础操作/5-资料任务/手册/01.png", "cap": "图1-4 资料任务入口"}, {"src": "基础操作/5-资料任务/手册/02.png", "cap": "图1-5 资料任务界面"}]}, "答题卡任务（制答题卡）": {"sec": "3. 答题卡任务（P3-6）", "text": ["答题卡任务", "点击【制答题卡】任务，可以跳转到如下图1-7所示的答题卡制作界面；", "第一步：需要输入答题卡/试卷名称；", "第二步：根据需要上传的题目进行答题卡部分的制作，根据实际选择题数量、非选择题数量添加题目的题号；选择题部分的答案，可以直接点击选择题答案。", "第三步：上传需要文件的电子档，支持多种格式上传；附件部分可以上传英语的听力；Word导入：需要题目、答案分离，格式完整清晰的文件使用。", "点击【添加题目】，添加所需题型，题目数量，题号，选项个数，题目分值，如图1-9所示：", "选择题勾选答案即可，多选题勾选多个答案，如图1-10所示：", "点击【答案/解析】设置答案/解析（可文字录入、复制粘贴、截图）如图1-11所示：", "设置好答题卡的名称、选择题的答案，然后点击切题。", "建议选择逐题框选、模式选择—快速；在这个模式下可以给题目设置标准的边框线，只需要按住鼠标左键进行框选题目和答案。如下图1-12所示：", "可以将需要录入的资料发给工作人员辅助上传。"], "imgs": [{"src": "基础操作/6-答题卡任务/手册/01.png", "cap": "图1-6 制答题卡入口"}, {"src": "基础操作/6-答题卡任务/手册/02.png", "cap": "图1-7 答题卡制作界面"}, {"src": "基础操作/6-答题卡任务/手册/03.png", "cap": "图1-8 添加题目"}, {"src": "基础操作/6-答题卡任务/手册/04.png", "cap": "图1-11 答案/解析设置"}, {"src": "基础操作/6-答题卡任务/手册/05.png", "cap": "图1-12 切题框选"}]}, "错题重练（教师篇专题）": {"sec": "二、4. 错题反扫（P21-23）", "text": ["错题反扫", "4.1重练统计：", "可以看到班级的重练完成情况，统计中可以看到班级维度下，学生的班级重连得分率、班级重练完成率；", "同时可以看到学生各自的重练得分率，错题任务完成率、以及学生的个性错题本。如图2-11所示；", "4.2共性错题", "可以看到已完成任务中学生的共性错题部分，可以通过不同的任务类型进行筛选；可以选定任务的时间区间，方便阶段性的巩固。", "选择共性错题时，可以参考练习得分率，可以优先选择得分率低于年级的题目，然后加入选题，发布任务。如图2-12所示。", "4.3错题重练修改", "适用于任务发布过程中忘记打开错题重练的功能，快速实现任务错题重练功能。点击需要查看的任务，在任务详情界面的右上角有错题重练的按钮，如图2-13所示。可以将不重练修改为个性错题、为防止错题数量过多，学生没有充足时间完成当日新任务，建议设置最大题量，设置好发布时间，推荐时间设置为任务发布后第二天，可根据实际情况修改。修改好阅卷方式、重练题型，点击确认。学生即可在设置好的发布时间收到原错题进行重练。如图2-14所示。"], "imgs": [{"src": "深入使用/1-错题重练/手册/01.png", "cap": "图2-10 错题反扫入口"}, {"src": "深入使用/1-错题重练/手册/02.png", "cap": "图2-11 重练统计"}, {"src": "深入使用/1-错题重练/手册/03.png", "cap": "图2-12 共性错题"}, {"src": "深入使用/1-错题重练/手册/04.png", "cap": "图2-13 错题重练修改"}, {"src": "深入使用/1-错题重练/手册/05.png", "cap": "图2-14 重练设置"}]}, "靶向提升（分层靶向班）": {"sec": "三、3. 靶向教学（P27-33）", "text": ["3.1对人靶向", "把鼠标慢慢移动到靶向的位置，会出现“对人靶向”、“对点靶向”；点击对人靶向。", "第一步：找到任教/学生所在的班级。", "第二步：设置好科目，可以是全科/任教的学科，设置某段时间的学情，开始时间、结束时间", "第三步：找到学生的姓名，也可以通过搜索去寻找需要靶向提升的学生。然后点击学生姓名。", "在此界面可以看到学生某段时间内，总分的平均分、平均排名、最近排名等信息。", "可以看到学生的每个学科的成绩排名，标红的部分表示是拉分的学科，可以针对于这些学科进行靶向提升，点击薄弱学科的学情图谱：", "点击【6函数及其表示】→点击【对题靶向】，如图3-11所示：", "可从全部错题/高考真题/相似题中选择题目推送给学生，达到对人对点对题个体培优的效果，如图3-12所示：", "3.2对点靶向", "针对于此知识点下，学生的得分情况会被展示在学生学情中，可以根据学生的得分率框选柱状图，框选完成后右侧部分学生姓名之前会出现对勾如下图所示，也可以通过双维度分布框选学生，需要调整部分，直接取消学生前边的对勾就可以。对这些学生创建靶向班进行题目的推送，如图3-14，3-15所示。", "提供多种选题方式：共性错题、高考真题、题库选题。方便找到题目进行题目的推送。", "建议在题目选取的时候选择具备视频解析的题目，方便学生完成题目后及进行习题的巩固。", "题目选取之后加入选题可以发送到创建的靶向班，如图3-16所示。"], "imgs": [{"src": "深入使用/2-靶向提升/手册/01.png", "cap": "图3-7 靶向入口"}, {"src": "深入使用/2-靶向提升/手册/02.png", "cap": "图3-8 对人靶向"}, {"src": "深入使用/2-靶向提升/手册/03.png", "cap": "图3-9 学情画像"}, {"src": "深入使用/2-靶向提升/手册/05.png", "cap": "图3-14 得分率框选"}, {"src": "深入使用/2-靶向提升/手册/06.png", "cap": "图3-20 按知识点建班"}, {"src": "深入使用/2-靶向提升/手册/07.png", "cap": "图3-24 按分值建班"}]}, "微信小程序上传音视频（题目讲解三法）": {"sec": "二、2. 批改阅卷 ／ 2.5 文字标注（P17-19）", "text": ["批改阅卷", "任务界面中的【批改阅卷】进入作业批改界面，点击开始阅卷。如图2-4所示。", "2.1题目批阅：", "可选择按题阅/按人阅；按人阅，每个学生任务全部批阅完成自动跳转下一个学生；按题阅，会根据题目进行批阅，相同题目，一个学生一个学生批阅。", "2.2打分方式：", "打分板：提供快捷的打分方式，可更改打分步长：例如，步长是1，分值为1、2、3、4、5......", "标注给分：适用于填空题或者简答题，选中加分/减分，直接点击屏幕可以实现打分。如图2-5所示；", "2.3作业分享：", "可以分享学生的优秀作业给别的学生查看。方便学生借鉴模仿。", "提供了多种分享原因，可直接选取。如图2-6所示；", "2.4打回重做：", "可以把学生提交的作业退回，打回后提交任务的时间应该和第一次提交任务的时间间隔15分钟。如图2-5所示；", "打回后应该监督学生重交，否则系统计算的任务数据将不准确（比如，该学生会始终待阅，得分率等数据也会计算改学生的）", "2.5文字标注："], "imgs": [{"src": "深入使用/3-微信小程序上传音视频/手册/01.png", "cap": "图2-4 批改阅卷入口"}, {"src": "深入使用/3-微信小程序上传音视频/手册/02.png", "cap": "图2-6 作业分享"}, {"src": "深入使用/3-微信小程序上传音视频/手册/03.png", "cap": "图2-7 文字标注"}, {"src": "深入使用/3-微信小程序上传音视频/手册/04.png", "cap": "图2-7 语音讲解（小程序）"}]}, "考试系统与考后反扫（图文要点）": {"sec": "三、5.3 答题卡扫描（P40-41）", "text": ["5.3答题卡扫描（仅扫卡模式需要）", "1、整理好答题卡，打开“辅立码课扫卡客户端”（需要提前安装），再通过USB数据线连接扫描仪。（注意先后顺序）", "2、点击进入考试，在需要扫卡的学科后点击扫描答题卡，选择考试班级并确认", "3、开始扫卡，放入一张答题卡，第一张扫描后会出现校验页面，校验红框是否将答题框全部覆盖。", "4、扫卡过程中会出现异常试卷，点击【异常情况】即可进入异常试卷处理页面（请不要重复提交）", "5、常见异常卷处理方式", "考号识别异常：根据学生卷面信息输入考号或姓名检索提交即可", "客观题异常：根据学生涂卡情况及提示缺失题目勾选即可，如果学生没有填直接提交", "6、扫卡结束并解决异常卷之后返回考试页面，开始阅卷分配， 为老师分配批阅题目。", "7、返回考试页面点击【开始阅卷】即可阅卷", "8、阅卷结束后，点击【结束阅卷】。", "9、结束阅卷后，可进行成绩统计查询、及excel导出。"], "imgs": [{"src": "深入使用/5-考试系统与考后反扫/手册/01.jpeg", "cap": "扫卡：选择考试与班级"}, {"src": "深入使用/5-考试系统与考后反扫/手册/02.jpeg", "cap": "扫卡：校验红框"}, {"src": "深入使用/5-考试系统与考后反扫/手册/03.jpeg", "cap": "扫卡：异常卷处理"}]}, "学生提交任务退回（打回重做）": {"sec": "二、2.4 打回重做（P18）", "text": ["2.4打回重做：", "可以把学生提交的作业退回，打回后提交任务的时间应该和第一次提交任务的时间间隔15分钟。如图2-5所示；", "打回后应该监督学生重交，否则系统计算的任务数据将不准确（比如，该学生会始终待阅，得分率等数据也会计算改学生的）"], "imgs": [{"src": "教师端常见问题/2-学生提交任务退回/手册/01.png", "cap": "图2-5 打回重做"}, {"src": "教师端常见问题/2-学生提交任务退回/手册/02.png", "cap": "图2-5 退回理由"}, {"src": "教师端常见问题/2-学生提交任务退回/手册/03.png", "cap": "图2-6 作业分享"}]}, "任务完成情况统计": {"sec": "二、3. 完成统计（P20）", "text": ["完成统计", "任课教师，可以通过完成统计看到班级内学生的完成情况，可以设定时间段，可以进行完成率的排序，方便老师找到完成率低的同学。如图2-8所示", "班主任：可以通过学情部分，点击班级学情，找到任务统计，可以修改时间段，然后下载，可以看到班级内学生各个学科的任务统计，如图2-9所示"], "imgs": [{"src": "教师端常见问题/3-任务完成情况统计/手册/01.png", "cap": "图2-8 完成统计"}, {"src": "教师端常见问题/3-任务完成情况统计/手册/02.png", "cap": "图2-9 完成率排序"}]}, "修改学生密码": {"sec": "4.5 修改学生密码（P36）", "text": ["4.5修改学生密码", "第一步：点击左下角齿轮；第二步：点击我的班级；第三步：找到需要移除修改密码的学生点击密码，如图3-27、图3-28所示。", "辅立教学-微信小程序中完成学生密码修改：右下角点击“我”—学生管理—对应学生—修改密码，输入学生新密码，点击完成即可，如图3-29所示。"], "imgs": [{"src": "教师端常见问题/4-修改学生密码/手册/01.png", "cap": "图3-27 我的班级"}, {"src": "教师端常见问题/4-修改学生密码/手册/02.png", "cap": "图3-28 修改密码"}, {"src": "教师端常见问题/4-修改学生密码/手册/03.png", "cap": "图3-29 小程序端修改"}]}, "删除班级内学生": {"sec": "4.2 删除学生信息（P35）", "text": ["4.2删除学生信息（班主任权限）", "第一步：点击左下角齿轮；第二步：点击我的班级；第三步：找到需要移除的学生点击删除。"], "imgs": [{"src": "教师端常见问题/5-删除班级内学生/手册/01.png", "cap": "图3-26 删除学生"}]}, "题目讲解的三种方法": {"sec": "二、1. 大屏讲题（P16-17）", "text": ["大屏讲题", "任务发布成功后，点击需要查看的任务，可以看到任务的完成情况：", "点击发布过的任务进入之后，可以看到本次任务的完成情况，本次任务的平均分、得分率、完成率、以及阅卷情况。", "柱状图部分：柱状体的横坐标代表任务中题目的题号；纵坐标代表题目的得分率。红色代表得分率低，绿色代表得分率较高，可以以此作为判断标准，红色课堂重点讲解，绿色对学生课下单独讲解。", "讲解过程：点击【大屏讲题】：左侧是题目的题号，题号的框是绿色得分率高，题目的框是红色得分率低，", "点击退出上方的按钮，可以看到学生关于题目的作答情况，可以看到每个学生具体选择的哪个选项。如图2-3所示", "批注讲解：教师可以在教室的大屏进行题目的讲解，可以写板书，讲解完成之后，可以点击发送学生，学生就可以收到本道题目讲解的板书，方便学生课下整理。", "随机点名：为了增加课程的互动性，提高学生的专注度，可以实现点名，可以根据学生的实际选项进行点名。如图2-3所示"], "imgs": [{"src": "教师端常见问题/6-题目讲解三种方法/手册/01.png", "cap": "图2-1 大屏讲题入口"}, {"src": "教师端常见问题/6-题目讲解三种方法/手册/02.png", "cap": "图2-2 题目讲解界面"}, {"src": "教师端常见问题/6-题目讲解三种方法/手册/03.png", "cap": "图2-3 学生作答情况"}]}};

var CDN_BASE = "https://gcore.jsdelivr.net/gh/hyena007/gaohong-fulima-handbook@main/";
function fallbackVideo(v) {
  if (v.getAttribute("data-fb")) return;
  v.setAttribute("data-fb", "1");
  v.src = v.getAttribute("data-local");
  v.load();
}
function renderDetail(s) {
  var html = '<div class="d-head"><h2>' + s.title + '</h2><span class="badge ' + BADGE[s.group][0] + '">' + BADGE[s.group][1] + ' ' + s.no + '</span></div>';
  if (s.scene) html += '<div class="block"><h3>适用场景</h3><p>' + s.scene + '</p></div>';
  if (s.steps && s.steps.length) {
    html += '<div class="block"><h3>操作步骤 / 要点</h3><ol>' + s.steps.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ol></div>';
  }
  if (s.tips) html += '<div class="block"><div class="tip"><b>提示</b> · ' + s.tips + '</div></div>';
  if (s.metric) html += '<div class="block"><div class="metric"><b>指标口径</b> · ' + s.metric + '</div></div>';
  if (s.imgs && s.imgs.length) {
    html += '<div class="block"><h3>手册截图（点击放大）</h3><div class="imgs">' +
      s.imgs.map(function (p) { return '<img src="' + encodeURI(p) + '" alt="操作截图" onclick="zoom(this.src)">'; }).join("") + '</div></div>';
  }
  if (s.guide) {
    html += '<div class="block"><h3>图文专题 · <a href="' + encodeURI(s.guide) + '" target="_blank" style="color:var(--orange);text-decoration:none;">在新窗口全屏打开 ↗</a></h3>' +
      '<iframe src="' + encodeURI(s.guide) + '" style="width:100%;height:760px;border:1px solid var(--border);border-radius:10px;background:#fff;" loading="lazy"></iframe>' +
      '<div class="no-video" style="margin-top:8px;">内嵌页面可滚动阅读完整专题（含操作截图）；点击标题右侧链接可在独立窗口全屏浏览。</div></div>';
  }
  html += '<div class="block"><h3>配套视频</h3>';
  if (s.video) {
    html += '<div class="video-box"><video id="v" src="' + CDN_BASE + encodeURI(s.video) + '" data-local="' + encodeURI(s.video) + '" onerror="fallbackVideo(this)" controls controlslist="nodownload" preload="metadata" playsinline></video></div>' +
      '<div class="no-video" style="margin-top:8px;">视频走加速线路播放，线路异常时会自动切回原地址；若仍卡顿，可用本地离线文件夹中的同名视频。</div>';
  } else {
    html += '<div class="no-video">本条为图文解析，暂无独立视频；相关操作演示可观看左侧「基础操作」或「深入使用」分类中的配套视频。</div>';
  }
  html += '</div>';
  var man = MANUAL[s.title];
  if (man) {
    html += '<div class="block"><h3>配套手册 · ' + man.sec + '</h3>';
    if (man.text && man.text.length) html += '<div class="manual-text">' + man.text.map(function (x) { return '<p>' + x + '</p>'; }).join("") + '</div>';
    if (man.imgs && man.imgs.length) html += '<div class="figs">' + man.imgs.map(function (f) {
      return '<figure onclick="zoom(\'' + encodeURI(f.src) + '\')"><img src="' + encodeURI(f.src) + '" alt="' + f.cap + '"><figcaption>' + f.cap + '（点击放大）</figcaption></figure>';
    }).join("") + '</div>';
    html += '</div>';
  }
  detailEl.innerHTML = html;
  detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
}

function select(s) {
  current = s;
  renderNav(document.getElementById("search").value.trim());
  renderDetail(s);
}
function filterNav(v) { renderNav(v.trim()); }
function zoom(src) {
  document.getElementById("imgMaskImg").src = src;
  document.getElementById("imgMask").classList.add("show");
}

select(DATA[3]);
</script>
</body>
</html>
